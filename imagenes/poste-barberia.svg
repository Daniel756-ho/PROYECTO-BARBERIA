<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="title desc">
  <title id="title">Poste clásico de barbería</title>
  <desc id="desc">Poste vertical de barbería con cilindro blanco, franjas diagonales rojas y azules, tapas metálicas doradas y base negra.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#6f5524"/>
      <stop offset=".22" stop-color="#e5c36b"/>
      <stop offset=".48" stop-color="#fff0b2"/>
      <stop offset=".72" stop-color="#b68a36"/>
      <stop offset="1" stop-color="#594018"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#d7d9dc"/>
      <stop offset=".18" stop-color="#fff"/>
      <stop offset=".5" stop-color="#f2f1ed"/>
      <stop offset=".82" stop-color="#fff"/>
      <stop offset="1" stop-color="#aeb3b8"/>
    </linearGradient>
    <clipPath id="tubeClip"><rect x="116" y="116" width="128" height="488" rx="62"/></clipPath>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#8f1019"/><stop offset=".5" stop-color="#ed3440"/><stop offset="1" stop-color="#9e111c"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#102b52"/><stop offset=".5" stop-color="#356ba8"/><stop offset="1" stop-color="#142f58"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <ellipse cx="180" cy="672" rx="104" ry="17" fill="#000" opacity=".24" filter="url(#shadow)"/>
  <!-- wall mount -->
  <path d="M151 70h58v45h-58z" fill="#171717" stroke="url(#metal)" stroke-width="5"/>
  <path d="M161 75v35m38-35v35" stroke="#d7b45b" stroke-width="3" opacity=".7"/>
  <!-- upper cap -->
  <path d="M128 112q0-20 20-20h64q20 0 20 20v22H128z" fill="url(#metal)" stroke="#61491f" stroke-width="3"/>
  <ellipse cx="180" cy="113" rx="52" ry="12" fill="#fff0b4" opacity=".45"/>
  <!-- glass cylinder -->
  <rect x="116" y="116" width="128" height="488" rx="62" fill="url(#glass)" stroke="#9b9da0" stroke-width="3"/>
  <g clip-path="url(#tubeClip)">
    <rect x="116" y="116" width="128" height="488" fill="#f4f3ef"/>
    <g transform="rotate(-32 180 360)">
      <rect x="80" y="90" width="200" height="620" fill="#f7f5ef"/>
      <g fill="url(#red)">
        <rect x="88" y="70" width="35" height="700"/><rect x="158" y="70" width="35" height="700"/><rect x="228" y="70" width="35" height="700"/>
      </g>
      <g fill="url(#blue)">
        <rect x="123" y="70" width="35" height="700"/><rect x="193" y="70" width="35" height="700"/>
      </g>
    </g>
    <rect x="128" y="130" width="13" height="455" rx="7" fill="#fff" opacity=".56"/>
    <rect x="224" y="140" width="7" height="430" rx="4" fill="#fff" opacity=".3"/>
  </g>
  <!-- lower rim and cap -->
  <path d="M116 584h128v22q0 16-18 16h-92q-18 0-18-16z" fill="url(#metal)" stroke="#61491f" stroke-width="3"/>
  <ellipse cx="180" cy="607" rx="64" ry="13" fill="#f3d98b" opacity=".55"/>
  <path d="M145 622h70v18h-70z" fill="#181818" stroke="url(#metal)" stroke-width="4"/>
  <path d="M126 641h108l18 21H108z" fill="url(#metal)" stroke="#5d451d" stroke-width="3"/>
  <path d="M108 662h144q-4 17-22 17h-100q-18 0-22-17z" fill="#171717" stroke="url(#metal)" stroke-width="4"/>
  <ellipse cx="180" cy="664" rx="69" ry="8" fill="#d9b65f" opacity=".55"/>
  <!-- small finial -->
  <path d="M166 91q0-19 14-27 14 8 14 27z" fill="url(#metal)" stroke="#61491f" stroke-width="2"/>
  <circle cx="180" cy="60" r="9" fill="url(#metal)" stroke="#61491f" stroke-width="2"/>
</svg>
